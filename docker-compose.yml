version: '3.9'

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: olp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     olp_user
      POSTGRES_PASSWORD: olp_pass
      POSTGRES_DB:       offline_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olp_user -d offline_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── pgAdmin (optional visual DB explorer) ─────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: olp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@offline.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
